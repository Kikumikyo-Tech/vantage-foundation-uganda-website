<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Healers in Crisis: Why Uganda Cannot Afford to Lose Its Young Doctors">
  <title>Healers in Crisis — hero placeholder</title>
  <desc>Editorial hero placeholder. Deep teal background with the story headline and a thin teal-primary accent rule.</desc>

  <!-- Background: site --primary (#006b70) -->
  <rect width="1600" height="900" fill="#006b70" />

  <!-- Subtle paper-grain via faint diagonal hatch -->
  <defs>
    <pattern id="grainHero" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#006b70" />
      <line x1="0" y1="0" x2="0" y2="6" stroke="#ffffff" stroke-width="0.5" opacity="0.025" />
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#grainHero)" />

  <!-- Accent rule (3px, --programme-health #008f95) -->
  <rect x="160" y="320" width="120" height="3" fill="#008f95" />

  <!-- Kicker -->
  <text x="160" y="380" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="600" letter-spacing="7" fill="#ffffff" opacity="0.8">HEALERS IN CRISIS</text>

  <!-- Headline — two lines, bold, ~72px -->
  <text x="160" y="486" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff">Why Uganda cannot afford</text>
  <text x="160" y="572" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="700" fill="#ffffff">to lose its young doctors</text>

  <!-- Byline -->
  <text x="160" y="640" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#ffffff" opacity="0.7">Vantage Foundation Uganda  ·  Kampala  ·  31 July 2026</text>

  <!-- Bottom-left wordmark -->
  <text x="160" y="828" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="600" letter-spacing="2" fill="#ffffff" opacity="0.85">VANTAGE FOUNDATION UGANDA</text>
</svg>
